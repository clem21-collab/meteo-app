name: Android TWA build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-twa-build.yml'

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Bubblewrap
        working-directory: android-twa
        run: npm install

      - name: Configure Bubblewrap for CI
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cd android-twa
          npx bubblewrap doctor

      - name: Generate Android project
        working-directory: android-twa
        run: npx bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json

      - name: Build unsigned APK and AAB
        working-directory: android-twa
        run: npx bubblewrap build --skipSigning --skipPwaValidation --manifest=twa-manifest.json

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meteo-v5-android-unsigned
          if-no-files-found: error
          path: |
            android-twa/app/build/outputs/apk/release/app-release-unsigned.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
